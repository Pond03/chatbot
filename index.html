<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Workspace – Dark Mode</title>

  <link rel="icon" type="image/png" href="./chatbot.png" />

  <script>
    (function(){
      var t = localStorage.getItem('theme')
        || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="brand">
        <img src="./chatbot.png" alt="AI Logo" class="logo" />
        <div class="brand-text">
          <div class="brand-title">AI Workspace</div>
        </div>
      </div>

      <nav class="menu">
        <a class="menu-item active"><span class="dot dot-chat"></span> AI Chat</a>
        <a class="menu-item"><span class="dot"></span> Projects</a>
        <a class="menu-item"><span class="dot"></span> Templates</a>
        <a class="menu-item"><span class="dot"></span> Documents</a>
        <a class="menu-item"><span class="dot"></span> Community</a>
        <a class="menu-item"><span class="dot"></span> History</a>
      </nav>

      <div class="sidebar-bottom">
        <div class="theme-switch">
          <span id="themeLabel">Dark</span>
          <label class="switch">
            <input type="checkbox" id="themeToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="user">
          <span class="status"></span>
          <div>
            <div class="user-name">Wanwarin</div>
            <div class="user-mail">IL0vemyJ0b@gmail.com</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main">
      <header class="topbar">
        <div class="top-title">AI Chat</div>
        <button class="btn pill" id="newChatBtn">New</button>
      </header>

      <section class="card">
        <h1 class="hero">สวัสดี <span class="accent">Wanwarin</span></h1>

        <div class="chat-frame">
          <div class="chat-scroll" id="chatBox"></div>
        </div>

        <form class="composer" id="composer">
          <input id="prompt" class="composer-input" placeholder="พิมพ์ข้อความของคุณ..." autocomplete="off" />
          <div class="composer-actions">
            <button type="button" class="btn ghost pill" disabled>📎 Attach</button>
            <button type="button" class="btn ghost pill" disabled>🎙️ Voice Message</button>
            <button type="submit" class="btn primary pill">▶</button>
          </div>
        </form>
      </section>
    </main>

    <!-- ===== RIGHTBAR ===== -->
    <aside class="rightbar">
      <div class="right-title">Projects</div>
      <div class="project-item active">
        <span class="green-dot"></span>
        <div>
          <div class="project-name">New Project</div>
          <div class="project-sub">เริ่มโปรเจกต์ใหม่</div>
        </div>
      </div>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
